name: diag-net
on:
  workflow_dispatch: {}
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: connectivity test
        run: |
          echo "--- DNS ---"
          getent hosts app-data-mcp.luteos.site || echo "DNS FAIL"
          echo "--- TCP/HTTPS test (30s timeout) ---"
          curl -sS -m 30 -o /dev/null -w "HTTP:%{http_code} time:%{time_total}s ip:%{remote_ip}\n" https://app-data-mcp.luteos.site/mcp || echo "CONNECT FAIL"
          echo "--- control: google.com ---"
          curl -sS -m 15 -o /dev/null -w "HTTP:%{http_code}\n" https://www.google.com || echo "GOOGLE FAIL"
